version: '3.8'

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9091:9000"  # Acceso web en http://localhost:9000
    security_opt:
      - no-new-privileges:true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock  # Permite gestionar Docker
      - /home/dashcloudbi/docker/datos/portainer:/data  # Volumen persistente
    networks:
      - netadmin
networks:
  netadmin:
    external: true
